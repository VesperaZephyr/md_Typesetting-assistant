name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: Build single-file bundle
        run: npm run build

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-typesetting-assistant
          path: dist/index.html
